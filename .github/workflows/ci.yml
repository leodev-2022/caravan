name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --quiet pyyaml ruff
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: make ci (check + test-cli + smoke)
        run: make ci
